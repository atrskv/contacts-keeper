<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Contacts Keeper{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-custom-bold" href="/">Contacts Keeper</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" id="all_the_contacts" href="/">Все</a></li>
                    <li class="nav-item"><a class="nav-link" id="add_new" href="/contacts/new">Добавить новый</a></li>
                    <li class="nav-item"><a class="nav-link" id="show_random" href="/contacts/random">Показать случайный</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1  pt-5 pb-1">
        <div class="container container-lg">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-7 mt-3">

                    {% block content %}
                    {% endblock %}

                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white text-center py-3 border-top">
        <div class="container">
            <small class="text-muted">&copy; {{ current_year }} Contacts Keeper. Добавляйте, храните, будьте на связи!</small>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const alerts = document.querySelectorAll(".alert");

            alerts.forEach((alert) => {
                setTimeout(() => {
                    const alertInstance = bootstrap.Alert.getOrCreateInstance(alert);
                    alertInstance.close();
                }, 3000);
            });
        });
    </script>
</body>

</html>
